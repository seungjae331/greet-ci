[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greet-week07"
version = "0.1.0"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]

[dependency-groups]
dev = [
    "black==25.1.0",
    "flake8==7.3.0",
    "flake8-bugbear==24.12.12",
    "mypy==1.18.2",
    "pytest==8.4.2",
]
